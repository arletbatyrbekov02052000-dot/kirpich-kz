<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Mulish:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --orange:#E8511A;
  --orange-dark:#C43E0E;
  --cream:#FFF8F4;
  --dark:#1A0A00;
  --gray:#6B5B52;
  --border:#F0DDD4;
  --white:#FFFFFF;
}
body{font-family:'Mulish',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;}

nav{display:flex;justify-content:space-between;align-items:center;padding:16px 48px;background:var(--white);border-bottom:1px solid var(--border);}
.logo{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;color:var(--orange);cursor:pointer;}
.logo span{color:var(--dark);}
.nav-link{font-size:14px;color:var(--gray);cursor:pointer;}

.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}

.auth-box{background:#fff;border-radius:24px;padding:48px;max-width:440px;width:100%;box-shadow:0 8px 40px rgba(232,81,26,0.08);}

.auth-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;margin-bottom:8px;}
.auth-sub{font-size:15px;color:var(--gray);margin-bottom:32px;}

.form-group{margin-bottom:16px;}
.form-label{font-size:13px;font-weight:600;margin-bottom:6px;display:block;color:var(--dark);}
.form-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'Mulish',sans-serif;font-size:15px;color:var(--dark);outline:none;background:#fff;}
.form-input:focus{border-color:var(--orange);}

.forgot{text-align:right;margin-top:-8px;margin-bottom:16px;}
.forgot a{font-size:13px;color:var(--orange);cursor:pointer;font-weight:600;}

.btn-main{width:100%;background:var(--orange);color:#fff;padding:16px;border-radius:10px;border:none;font-family:'Mulish',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:13px;color:var(--gray);}

.btn-outline{width:100%;background:#fff;color:var(--dark);border:1.5px solid var(--border);padding:14px;border-radius:10px;font-family:'Mulish',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}

.auth-footer{text-align:center;margin-top:24px;font-size:14px;color:var(--gray);}
.auth-footer a{color:var(--orange);font-weight:600;cursor:pointer;}

.error-msg{background:#FEE8DD;color:var(--orange-dark);padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none;}
.error-msg.show{display:block;}

.success-box{display:none;text-align:center;padding:20px 0;}
.success-box.show{display:block;}
.success-icon{font-size:64px;margin-bottom:20px;}
.success-title{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;margin-bottom:12px;}
.success-text{font-size:15px;color:var(--gray);line-height:1.6;margin-bottom:32px;}
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="window.location='index.html'">КИРПИЧ<span>.KZ</span></div>
  <div class="nav-link" onclick="window.location='register.html'">Нет аккаунта? Зарегистрироваться</div>
</nav>

<div class="page">
  <div class="auth-box">

    <div id="login-form">
      <div class="auth-title">Добро пожаловать!</div>
      <div class="auth-sub">Войдите в свой аккаунт</div>

      <div class="error-msg" id="error-msg">
        ❌ Неверный телефон или пароль
      </div>

      <div class="form-group">
        <label class="form-label">Номер телефона</label>
        <input class="form-input" type="tel" id="phone" placeholder="+7 777 123 45 67">
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" type="password" id="password" placeholder="Введите пароль">
      </div>

      <div class="forgot"><a>Забыли пароль?</a></div>

      <button class="btn-main" onclick="login()">Войти →</button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">или</div>
        <div class="divider-line"></div>
      </div>

      <button class="btn-outline" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>
        Войти через Google
      </button>

      <div class="auth-footer">
        Нет аккаунта? <a onclick="window.location='register.html'">Зарегистрироваться</a>
      </div>
    </div>

    <div class="success-box" id="success-box">
      <div class="success-icon">👋</div>
      <div class="success-title">Добро пожаловать!</div>
      <div class="success-text">Вы успешно вошли в аккаунт. Переходим в личный кабинет...</div>
      <button class="btn-main" onclick="window.location='dashboard.html'">Перейти в кабинет →</button>
    </div>

  </div>
</div>

<script>
function login() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!phone || !password) {
    document.getElementById('error-msg').classList.add('show');
    return;
  }
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('success-box').classList.add('show');
}
function loginWithGoogle() {
  alert('Google вход — будет добавлен позже!');
}
</script>
</body>
</html>
